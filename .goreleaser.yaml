version: 2
project_name: programmapper-cli
changelog:
  disable: true
builds:
  - id: programmapper-cli
    main: ./cmd/programmapper-cli
    binary: programmapper-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X programmapper-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: programmapper-mcp
    main: ./cmd/programmapper-mcp
    binary: programmapper-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: programmapper-cli
    repository:
      owner: johnnyrobot
      name: homebrew-tap
    homepage: "https://github.com/johnnyrobot/programmapper-cli"
    description: "Every California Community College's program maps - degrees, courses, transfer paths, and careers - in one scriptable CLI with an offline SQLite catalog and term-by-term planning no other ProgramMapper tool has."
    install: |
      bin.install "programmapper-cli"
      bin.install "programmapper-mcp"
